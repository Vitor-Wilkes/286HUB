<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>286HUB</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#5ec8ff;--sky2:#b8ecff;--ink:#1a1033;--card:#fff9e6;--text:#1a1033;
  --pink:#ff5fa2;--yellow:#ffd23f;--green:#3ddc84;--blue:#3a86ff;--orange:#ff8c42;--purple:#9b5de5;
  --cloud:#ffffff;--star:0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky1:#1b1448;--sky2:#3a2a86;--ink:#000;--card:#2b2160;--text:#fff4d6;--cloud:#5a4bb0;--star:1}
}
:root[data-theme="dark"]{--sky1:#1b1448;--sky2:#3a2a86;--ink:#000;--card:#2b2160;--text:#fff4d6;--cloud:#5a4bb0;--star:1}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;color:var(--text);
  background:var(--sky1);min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;background:linear-gradient(var(--sky1),var(--sky2))}
/* nuvens: movidas por JS (vão e voltam, fogem do mouse) */
.cloud{position:absolute;left:0;top:0;width:96px;height:32px;background:var(--cloud);box-shadow:32px -16px 0 var(--cloud),64px 0 0 var(--cloud),-16px 16px 0 var(--cloud);opacity:.9;will-change:transform}
.star{position:absolute;width:8px;height:8px;background:var(--yellow);opacity:0;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0}50%{opacity:var(--star)}}
.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(80px + env(safe-area-inset-bottom,0px))}
/* loader + wave */
#loader{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#fff}
#loader h1{font-size:clamp(28px,8vw,56px);margin:0;color:var(--yellow);text-shadow:4px 4px 0 var(--pink)}
.bar{width:min(320px,70vw);height:28px;border:4px solid #fff;padding:3px;display:flex;gap:3px}
.bar i{flex:1;background:var(--green);transform:scaleY(0);transition:transform .15s ease-out}
.bar i.on{transform:scaleY(1)}
.blink{font-size:10px;animation:bl 1.2s ease-in-out infinite}
@keyframes bl{50%{opacity:.2}}
#wave{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
#fx{image-rendering:pixelated;position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none;opacity:0;transition:opacity .45s ease}
/* header */
header{text-align:center;margin-bottom:34px;padding-top:clamp(28px,6vw,56px)}
.logo{font-size:clamp(48px,13vw,128px);margin:8px 0 0;display:flex;justify-content:center;gap:4px;flex-wrap:wrap;user-select:none;-webkit-user-select:none}
.logo span{position:relative;isolation:isolate;display:inline-block;cursor:pointer;color:var(--c);
  text-shadow:7px 7px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink);
  scale:var(--s,1);rotate:var(--r,0deg);transition:scale .14s ease-out,rotate .14s ease-out;will-change:transform}
.logo span::after{content:attr(data-l);position:absolute;left:0;top:0;z-index:-1;color:var(--c);
  text-shadow:0 0 18px var(--c),0 0 40px var(--c),0 0 6px #fff;opacity:.35;transition:opacity .18s ease-out;pointer-events:none}
.logo span.near::after{opacity:1}
.logo span.pop{animation:pop .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-46px) rotate(200deg) scale(1.3)}100%{transform:translateY(0) rotate(360deg)}}
body.fxing .logo span,body.fxing .emoji,body.fxing .star{animation-play-state:paused}
.tag{font-size:13px;margin:20px auto 0;line-height:1.9;max-width:560px;animation:rise .9s ease .3s backwards}
.panel{background:var(--card);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.tools{display:flex;justify-content:center;padding:14px;margin:0 auto 28px;max-width:420px}
.tools input{font-size:11px;padding:12px;border:4px solid var(--ink);background:#fff;color:#1a1033;width:100%}
/* grid: até 4 por linha; colunas e tamanho máximo definidos por JS conforme a quantidade de jogos */
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:28px;margin:0 auto;max-width:var(--gmax,none)}
.game{position:relative;container-type:inline-size;background:var(--card,#fff9e6);color:var(--tx,var(--text));border:4px solid var(--edge,var(--ink));outline:4px solid var(--ink);outline-offset:0;box-shadow:6px 6px 0 4px var(--ink);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .4s ease,opacity .3s ease;animation:rise .7s cubic-bezier(.2,.9,.3,1.2) backwards}
.game.tilt{transition:transform .1s linear,box-shadow .3s ease,opacity .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.9)}}
.game a{display:block;color:inherit;text-decoration:none}
.game:hover,.game:focus-within{transform:translateY(-8px) rotate(-1.2deg) scale(1.02);box-shadow:12px 16px 0 4px var(--ink)}
.game:nth-child(even):hover{transform:translateY(-8px) rotate(1.2deg) scale(1.02)}
.game.hide{opacity:0;transform:scale(.85);pointer-events:none}
.cover{aspect-ratio:8/5;border-bottom:4px solid var(--edge,var(--ink));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--cv)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover img.pix{image-rendering:pixelated}
.emoji{font-size:clamp(40px,26cqw,110px);text-shadow:4px 4px 0 rgba(0,0,0,.35);animation:bob 2.4s ease-in-out infinite}
.game:hover .emoji{animation:wiggle .7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes wiggle{0%,100%{transform:rotate(-10deg) scale(1.1)}50%{transform:rotate(10deg) scale(1.2)}}
.badge{position:absolute;top:8px;left:8px;font-size:clamp(7px,3cqw,11px);padding:6px;border:3px solid var(--ink);background:var(--pink);color:#fff;transform:rotate(-6deg);z-index:2}
.badge.hot{background:var(--orange)}
.owners{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}
.own{font-size:clamp(7px,2.8cqw,10px);padding:5px 7px;border:3px solid var(--ink);background:var(--blue);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.own:nth-child(2){background:var(--purple)}
.own:nth-child(3){background:var(--orange)}
.info{padding:clamp(10px,5cqw,20px)}
.info h3{font-size:clamp(11px,5.4cqw,20px);line-height:1.5;margin:0 0 8px}
.info p{font-size:clamp(8px,3.2cqw,12px);line-height:1.9;margin:0 0 12px;opacity:.9}
.play{display:inline-block;font-size:clamp(9px,4cqw,14px);padding:10px 14px;background:var(--green);color:#1a1033;border:4px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:background .2s,transform .2s}
.game:hover .play{background:var(--yellow);transform:translateX(4px)}
.adm{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3}
.adm button{font-size:10px;padding:6px 8px;border:3px solid var(--ink);background:#fff;color:#1a1033}
.empty{text-align:center;padding:40px;font-size:12px;line-height:2;display:none}
footer{text-align:center;font-size:9px;margin-top:48px;line-height:2}
/* ===== TEMAS por estilo de jogo ===== */
.t-arcade{--cv:linear-gradient(45deg,rgba(255,255,255,.2) 25%,transparent 25% 75%,rgba(255,255,255,.2) 75%) 0 0/32px 32px,#ff5fa2}
.t-espaco{--card:#101a4a;--tx:#e8f6ff;--edge:#6be4ff;--cv:radial-gradient(circle at 20% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 75% 60%,#ffd23f 0 2px,transparent 3px),radial-gradient(circle at 45% 82%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 18%,#fff 0 1.5px,transparent 2.5px),linear-gradient(#0b1033,#3a1a7a)}
.t-cobra{--card:#d8f5c8;--tx:#13351d;--edge:#1f7a3b;--cv:repeating-conic-gradient(#35b05a 0 25%,#238a43 0 50%) 0 0/32px 32px}
.t-corrida{--card:#fff;--tx:#1a1033;--edge:#e63946;--cv:linear-gradient(90deg,transparent 0 50%,#fff 50% 100%) 0 50%/48px 6px repeat-x,repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/20px 20px top/100% 20px no-repeat,#4a4a58}
.t-corrida .emoji{animation:zoom 1.8s ease-in-out infinite alternate}
@keyframes zoom{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.t-fantasma{--card:#2b1d4d;--tx:#f1e6ff;--edge:#c9a7ff;--cv:radial-gradient(circle at 50% 120%,#8a5cd6,transparent 60%),linear-gradient(#1a1033,#4b2f7f)}
.t-fantasma .emoji{animation:float 3s ease-in-out infinite;opacity:.9}
@keyframes float{50%{transform:translateY(-14px);opacity:.6}}
.t-puzzle{--card:#fff6c8;--edge:#ff5fa2;--cv:repeating-conic-gradient(#ff5fa2 0 25%,#ffd23f 0 50%,#3a86ff 0 75%,#3ddc84 0 100%) 0 0/48px 48px}
.t-aventura{--card:#e9fbe0;--tx:#1f3a14;--edge:#2f9e4f;--cv:linear-gradient(transparent 72%,#3ddc84 72% 86%,#8b5a2b 86%),linear-gradient(#7fd4ff,#d6f3ff)}
.t-oceano{--card:#d9f1ff;--tx:#0a2a55;--edge:#0b5ed7;--cv:radial-gradient(circle at 50% 0,transparent 0 10px,rgba(255,255,255,.45) 11px 14px,transparent 15px) 0 0/32px 22px,linear-gradient(#3aa0ff,#0b5ed7)}
.t-esporte{--card:#e8ffe8;--tx:#0f3a1a;--edge:#1f9d3a;--cv:radial-gradient(circle at 50% 50%,transparent 0 28px,rgba(255,255,255,.7) 29px 32px,transparent 33px),repeating-linear-gradient(90deg,#43c25a 0 40px,#38ab4c 40px 80px)}
.t-acao{--card:#fff0d6;--edge:#e63946;--cv:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 12px,transparent 12px 24px),linear-gradient(#ff3d3d,#ff8c42,#ffd23f)}
.t-aposta{--card:#1b1405;--tx:#ffe9a8;--edge:#ffc83d;--cv:radial-gradient(circle at 50% 50%,rgba(255,200,61,.3),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 2px,transparent 2px 24px),repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 2px,transparent 2px 24px),linear-gradient(#0f3d24,#06190f)}
.t-aposta .emoji{animation:coin 1.6s ease-in-out infinite}
@keyframes coin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
.t-golfe{--card:#eaffe0;--tx:#12351a;--edge:#1b7a2e;--cv:radial-gradient(circle at 80% 64%,#10230f 0 9px,transparent 10px),radial-gradient(ellipse at 18% 84%,#f1deaa 0 34px,transparent 35px),repeating-conic-gradient(#5bd16a 0 25%,#49bd5a 0 50%) 0 0/40px 40px}
.t-golfe .emoji{animation:putt 1.8s cubic-bezier(.3,0,.4,1) infinite}
@keyframes putt{0%,100%{transform:translate(-34px,8px)}50%{transform:translate(34px,-18px)}}
.t-palavras{--card:#1f1f2b;--tx:#fff;--edge:#b59f3b;--cv:linear-gradient(90deg,transparent calc(100% - 5px),#1f1f2b 0) 0 0/46px 46px,linear-gradient(transparent calc(100% - 5px),#1f1f2b 0) 0 0/46px 46px,repeating-conic-gradient(#538d4e 0 25%,#b59f3b 0 50%,#3a3a3c 0 75%,#538d4e 0 100%) 0 0/92px 92px}
.t-palavras .emoji{animation:flip 2.4s ease-in-out infinite}
@keyframes flip{0%,100%{transform:rotateX(0)}50%{transform:rotateX(180deg)}}
/* senha */
#pw{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(10,5,30,.65);padding:16px}
#pw[hidden]{display:none}
.pwbox{width:min(340px,100%);background:var(--card);color:var(--text);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px;font-size:10px}
.pwbox.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pwt{font-size:12px}
.pwbox input{width:100%;font-size:11px;padding:12px;border:3px solid var(--ink);background:#fff;color:#1a1033}
.pwbox input[hidden]{display:none}
#pwmsg{min-height:12px;font-size:9px;line-height:1.7;color:var(--pink)}
.pwrow{display:flex;gap:10px;justify-content:flex-end}
.pwrow button{font-size:10px;padding:10px 12px;border:4px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff;color:#1a1033}
.pwrow #pwok{background:var(--green)}
.pwrow button:disabled{opacity:.6;cursor:wait}
/* admin */
#out{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:10;font-size:10px;padding:12px;border:4px solid var(--ink);background:var(--pink);color:#fff;box-shadow:4px 4px 0 var(--ink);display:none}
#add{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:10;font-size:10px;padding:12px;border:4px solid var(--ink);background:var(--green);color:#1a1033;box-shadow:4px 4px 0 var(--ink);display:none}
dialog{border:4px solid var(--ink);background:var(--card);color:var(--text);box-shadow:8px 8px 0 var(--ink);padding:20px;width:min(440px,92vw);font-size:10px}
dialog::backdrop{background:rgba(10,5,30,.6)}
dialog h2{font-size:13px;margin:0 0 14px}
dialog label{display:block;margin:12px 0 6px}
dialog input,dialog select,dialog textarea{width:100%;font-size:10px;padding:10px;border:3px solid var(--ink);background:#fff;color:#1a1033}
dialog .row{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
dialog .row button{font-size:10px;padding:10px 14px;border:4px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff;color:#1a1033}
dialog .row .ok{background:var(--green)}
#msg{margin-top:10px;font-size:9px;color:var(--pink);min-height:12px}
</style>
</head>
<body>
<div id="loader"><h1>286HUB</h1><div class="bar" id="bar"></div><div class="blink">CARREGANDO...</div></div>
<canvas id="wave"></canvas>
<canvas id="fx"></canvas>
<div class="bg" id="bg"></div>
<button id="out" type="button">🔓 SAIR</button>
<button id="add">＋ NOVO JOGO</button>
<div class="wrap">
  <header>
    <h1 class="logo" id="logo" aria-label="286HUB"></h1>
    <p class="tag" id="tag"></p>
  </header>
  <div class="panel tools"><input id="q" type="search" placeholder="BUSCAR PELO NOME..." aria-label="Buscar pelo nome"></div>
  <main class="grid" id="grid"></main>
  <div class="empty panel" id="empty">NENHUM JOGO COM ESSE NOME :(</div>
  <footer>© <span id="sec">286HUB</span> · FEITO COM ♥ E MUITOS PIXELS</footer>
</div>

<div id="pw" hidden>
  <form class="pwbox" id="pwform" autocomplete="off">
    <div class="pwt">🔒 ÁREA DO DONO</div>
    <input id="pwin" type="password" placeholder="SENHA" autocomplete="off" spellcheck="false" aria-label="Senha">
    <input id="pwrepo" placeholder="usuario/repositorio" autocomplete="off" spellcheck="false" hidden aria-label="Repositório">
    <div id="pwmsg" role="alert"></div>
    <div class="pwrow"><button type="button" id="pwx">CANCELAR</button><button type="submit" id="pwok">ENTRAR</button></div>
  </form>
</div>

<dialog id="dlg">
  <h2 id="dtitle">NOVO JOGO</h2>
  <label>NOME</label><input id="fName" maxlength="40">
  <label>LINK DO JOGO</label><input id="fUrl" placeholder="https://...">
  <label>BREVE DESCRIÇÃO</label><textarea id="fDesc" rows="3" maxlength="90"></textarea>
  <label>DONO(S) DO JOGO (separe por vírgula ou "e")</label><input id="fOwner" maxlength="60" placeholder="Ex.: Wilkes  ou  Wilkes e Caio">
  <label>ESTILO (define o visual do bloco e a animação ao jogar)</label>
  <select id="fTheme"></select>
  <label>EMOJI (aparece na capa)</label><input id="fEmoji" maxlength="4" placeholder="🎮">
  <label>CAPA (imagem, opcional)</label><input id="fCover" type="file" accept="image/*">
  <div id="msg"></div>
  <div class="row"><button id="cancel" type="button">CANCELAR</button><button id="ok" class="ok" type="button">SALVAR</button></div>
</dialog>

<script type="application/json" id="seed">[
 {"id":"a1","name":"Pixel Pulo","url":"https://example.com/pixel-pulo","desc":"Pule, desvie e chegue na bandeira!","theme":"aventura","emoji":"🐸","tag":"NOVO"},

 {"id":"a4","name":"Corrida Maluca","url":"https://example.com/corrida","desc":"Derrube os rivais e cruze a linha.","theme":"corrida","emoji":"🏎️","tag":"HOT"},
 {"id":"a5","name":"Caça-Fantasma","url":"https://example.com/fantasma","desc":"Ilumine, capture e fuja!","theme":"fantasma","emoji":"👻","tag":"NOVO"},

<script>

/* ===== FRASES: é só adicionar mais uma linha na lista ===== */
const FRASES=[
  "No topo, não tem sextou nem feriado",
  "Chefe é Chefe",
  "Ai dentu",
  "Freitas é magnata"
  // , "sua próxima frase aqui"
];

/* ===== TEMAS: nome → rótulo (o visual de cada um está no CSS, classes .t-nome; a animação de "jogar" está em E.nome) ===== */
const TEMAS={arcade:"Arcade",espaco:"Espaço",cobra:"Cobrinha",corrida:"Corrida",fantasma:"Fantasma / Terror",puzzle:"Puzzle",aventura:"Aventura / Plataforma",oceano:"Oceano",esporte:"Esporte",acao:"Ação / Luta",aposta:"Aposta / Cassino",golfe:"Golfe",palavras:"Palavras / Termo"};

console.log("286HUB versão 10/11 - login por senha");
const $=s=>document.querySelector(s);
const COLORS=["#ff5fa2","#ffd23f","#3ddc84","#3a86ff","#ff8c42","#9b5de5"];
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=t=>1-Math.pow(1-clamp(t),3);
let games=JSON.parse($("#seed").textContent);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let admin=false;
let playing=false;

/* frase aleatória */
/* sorteada uma única vez ao abrir a página; ninguém consegue trocar */
$("#tag").textContent=FRASES[Math.random()*FRASES.length|0];

/* ===== logo interativo: letras crescem/brilham perto do mouse, clique = pulo + confete ===== */
$("#logo").innerHTML="286HUB".split("").map((c,i)=>`<span data-l="${c}" style="--c:${COLORS[i]};--i:${i}">${c}</span>`).join("");
const letters=[...$("#logo").children];
function burst(x,y,color,n=16){
  for(let i=0;i<n;i++){
    const d=document.createElement("div"),a=Math.random()*Math.PI*2,v=60+Math.random()*110,sz=5+Math.random()*7;
    d.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;background:${Math.random()<.5?color:COLORS[Math.random()*6|0]};z-index:40;pointer-events:none`;
    document.body.appendChild(d);
    d.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+40}px) scale(.2)`,opacity:0}],{duration:600+Math.random()*400,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>d.remove();
  }
}
letters.forEach((s,i)=>s.addEventListener("click",()=>{
  s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop");
  s.addEventListener("animationend",()=>s.classList.remove("pop"),{once:true});
  const r=s.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,COLORS[i]);
}));

/* ===== fundo: nuvens que vão e voltam (e fogem do mouse) + estrelas ===== */
const bg=$("#bg");
const clouds=[];
/* faixas verticais iguais, embaralhadas: nuvens espalhadas pela tela toda, sem amontoar */
const fys=[...Array(10).keys()].sort(()=>Math.random()-.5).map(k=>.03+(k+.2+Math.random()*.6)/10*.9);
for(let i=0;i<10;i++){
  const el=document.createElement("div");el.className="cloud";bg.appendChild(el);
  const sc=[.7,1,1.4,1.9][i%4],dir=i%2?1:-1;
  clouds.push({el,sc,dir,sp:(12+Math.random()*34)*sc*1,x:(i+Math.random()*.6)/10*innerWidth,fy:fys[i],by:fys[i]*innerHeight,oy:0});
}

let mx=-999,my=-999,pdirty=false,ptouch=false;

/* centros das letras guardados em coordenadas da página: nada de medir o layout a cada movimento */
const wrapEl=document.querySelector(".wrap"),near=letters.map(()=>false),lastS=letters.map(()=>"1.0"),lastR=letters.map(()=>0);
let lcx=[],lcy=[],lTop=0,lBot=0;
function measureLogo(){
  const L=wrapEl.getBoundingClientRect(),ox=L.left+scrollX,oy=L.top+scrollY;
  lcx=letters.map(s=>ox+s.offsetLeft+s.offsetWidth/2);
  lcy=letters.map(s=>oy+s.offsetTop+s.offsetHeight/2);
  lTop=Math.min(...lcy)-260;lBot=Math.max(...lcy)+260;

let logoWasActive=false;
function updateLogo(){
  const py=my+scrollY,active=!ptouch&&py>lTop&&py<lBot;
  if(!active&&!logoWasActive)return;      // mouse longe do letreiro: não faz nada
  logoWasActive=active;
  const px=mx+scrollX;let any=false;
  for(let i=0;i<letters.length;i++){
    const dx=px-lcx[i],dy=py-lcy[i];
    const k=active?Math.round(Math.max(0,1-Math.hypot(dx,dy)/170)*10)/10:0;
    if(k>0)any=true;
    const sv=(1+k*.85).toFixed(2),rv=Math.round(k*-dx/170*14/3)*3;
    const s=letters[i];
    if(sv!==lastS[i]){lastS[i]=sv;s.style.setProperty("--s",sv)}
    if(rv!==lastR[i]){lastR[i]=rv;s.style.setProperty("--r",rv+"deg")}
    const nr=k>=.3;if(nr!==near[i]){near[i]=nr;s.classList.toggle("near",nr)}
  }
  if(!any)logoWasActive=false;
}
let lastT=performance.now();
(function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;const W=innerWidth;
  if(pdirty){pdirty=false;updateLogo()}
  if(!playing)clouds.forEach(c=>{
    c.x+=c.dir*c.sp*dt;const cw=200*c.sc;
    if(c.dir>0&&c.x>W+cw)c.x=-cw;
    if(c.dir<0&&c.x<-cw)c.x=W+cw;
    const dx=c.x+80*c.sc-mx,dy=c.by+c.oy+8*c.sc-my,d=Math.hypot(dx,dy),R=170*Math.max(1,c.sc*.8);
    const tgt=d<R?(dy>=0?1:-1)*(R-d)*.9:0;
    c.oy+=(tgt-c.oy)*Math.min(1,dt*4);
    c.el.style.transform=`translate3d(${c.x.toFixed(1)}px,${(c.by+c.oy).toFixed(1)}px,0) scale(${c.sc})`;
  });
  requestAnimationFrame(loop);
})(lastT);

/* ===== transição em ONDA de pixels (canvas) usada na abertura ===== */
const cv=$("#wave"),cx=cv.getContext("2d");
function wave(dir,ms=800){
  return new Promise(res=>{
    cv.width=innerWidth;cv.height=innerHeight;
    const S=36,cols=Math.ceil(cv.width/S),rows=Math.ceil(cv.height/S),t0=performance.now();
    (function f(now){
      const p=Math.min((now-t0)/ms,1),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      const q=(dir==="in"?e:1-e)*1.3;
      cx.clearRect(0,0,cv.width,cv.height);
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
        const th=(c/cols)*.8+(Math.sin(r*.55+c*.12)*.5+.5)*.2;
        const s=Math.max(0,Math.min(1,(q-th)/.18));
        if(s<=0)continue;
        cx.fillStyle=COLORS[(c+r)%6];
        const w=S*s;cx.fillRect(c*S+(S-w)/2,r*S+(S-w)/2,w+.5,w+.5);
      }
      if(p<1)requestAnimationFrame(f);else{if(dir==="out")cx.clearRect(0,0,cv.width,cv.height);res()}
    })(t0);
  });
}

/* nome do jogo aparece no meio da animação */
function title(c,w,h,p,g){

  const tw=c.measureText(name).width;
  c.fillStyle="rgba(0,0,0,.6)";c.fillRect(w/2-tw/2-28,y-fs*1.1,tw+56,fs*2.6);
  c.fillStyle="#000";c.fillText(name,w/2+4,y+4);c.fillStyle="#ffd23f";c.fillText(name,w/2,y);
  if((p*14|0)%2===0){c.font=`${Math.max(8,fs*.32)}px "Press Start 2P",monospace`;c.fillStyle="#fff";c.fillText("CARREGANDO...",w/2,y+fs*.95)}

const fx=$("#fx"),fc=fx.getContext("2d");
function go(url){
  const w=window.open(url,"_blank");
  if(w){try{w.opener=null}catch(e){}}
  else location.href=url; // se o navegador bloquear o pop-up, abre nesta mesma aba
}
async function play(g,th){
  if(playing)return;
  playing=true;
  try{await Promise.race([document.fonts.load('20px "Press Start 2P"'),new Promise(r=>setTimeout(r,400))])}catch(e){}
  const sc=Math.max(1,innerWidth/1100);fx.width=Math.round(innerWidth/sc);fx.height=Math.round(innerHeight/sc);
  document.body.classList.add("fxing");fx.style.pointerEvents="auto";fx.style.opacity=1;
  const st={},fn=E[th]||E.arcade,t0=performance.now();
  await new Promise(res=>{
    (function f(now){
      const p=Math.min((now-t0)/FXD,1);
      fc.clearRect(0,0,fx.width,fx.height);fn(fc,fx.width,fx.height,p,st,g);title(fc,fx.width,fx.height,p,g);
      if(p<1)requestAnimationFrame(f);else res();
    })(t0);
  });
  go(g.url);
  fx.style.opacity=0;fx.style.pointerEvents="none";
  await new Promise(r=>setTimeout(r,500));
  fc.clearRect(0,0,fx.width,fx.height);document.body.classList.remove("fxing");playing=false;
}

let shownCount=0;
function layout(nn){
  const W=innerWidth,maxc=W>1250?4:W>900?3:W>520?2:1,num=Math.max(1,nn),cols=Math.min(maxc,num);
  const cm=num<=2?480:num===3?440:390,gr=$("#grid");
  gr.style.setProperty("--cols",cols);
  gr.style.setProperty("--gmax",W>900?(cols*cm+(cols-1)*28)+"px":"none");
}
addEventListener("resize",()=>layout(shownCount||games.length));

/* ===== cards ===== */
function card(g,i){
  const th=TEMAS[g.theme]?g.theme:"arcade";
  const el=document.createElement("div");
  el.className="game t-"+th;el.dataset.name=((g.name||"")+" "+(g.owner||"")).toLowerCase();
  const own=String(g.owner||"").split(/\s*(?:,|&|\+|\/|\be\b)\s*/i).map(x=>x.trim()).filter(Boolean).slice(0,3);
  el.style.animationDelay=(i*70)+"ms";
  if(th==="arcade")el.style.setProperty("--cv","linear-gradient(45deg,rgba(255,255,255,.2) 25%,transparent 25% 75%,rgba(255,255,255,.2) 75%) 0 0/32px 32px,"+COLORS[i%6]);
  el.innerHTML=`<a href="${esc(g.url)}" target="_blank" rel="noopener">
    <div class="cover">${g.tag?`<span class="badge ${g.tag==="HOT"?"hot":""}">${esc(g.tag)}</span>`:""}<span class="emoji">${esc(g.emoji||"🎮")}</span>${g.cover?`<img class="${g.coverPix?"pix":""}" src="${esc(g.cover)}" alt="Capa de ${esc(g.name)}">`:""}${own.length?`<div class="owners">${own.map(o=>`<span class="own">👤 ${esc(o)}</span>`).join("")}</div>`:""}</div>
    <div class="info"><h3>${esc(g.name)}</h3><p>${esc(g.desc)}</p><span class="play">▶ JOGAR</span></div></a>`;
  el.querySelector("a").addEventListener("click",ev=>{
    if(ev.button!==0||ev.ctrlKey||ev.metaKey||ev.shiftKey||ev.altKey)return; // ctrl/cmd+clique abre normal em nova aba
    ev.preventDefault();play(g,th);
  });
  /* inclinação 3D + brilho seguindo o mouse */
  if(matchMedia("(hover:hover)").matches){
    let rc=null,raf=0,lx=0,ly=0;
    el.addEventListener("pointerenter",()=>{rc=el.getBoundingClientRect();el.classList.add("tilt")});
    el.addEventListener("pointermove",e=>{
      lx=e.clientX;ly=e.clientY;if(raf||!rc)return;
      raf=requestAnimationFrame(()=>{
        raf=0;const px=clamp((lx-rc.left)/rc.width),py=clamp((ly-rc.top)/rc.height);
        el.style.transform=`perspective(800px) rotateX(${((.5-py)*10).toFixed(1)}deg) rotateY(${((px-.5)*12).toFixed(1)}deg) translateY(-8px) scale(1.03)`;
      });
    },{passive:true});
    el.addEventListener("pointerleave",()=>{if(raf){cancelAnimationFrame(raf);raf=0}el.classList.remove("tilt");el.style.transform=""});
  }
  if(admin){
    const a=document.createElement("div");a.className="adm";
    a.innerHTML=`<button title="Editar">✎</button><button title="Apagar">✕</button>`;
    a.children[0].onclick=()=>openForm(g);
    a.children[1].onclick=()=>{if(confirm("Apagar “"+g.name+"”?"))save(games.filter(x=>x.id!==g.id))};
    el.appendChild(a);
  }
  return el;
}
function render(){const gr=$("#grid");gr.innerHTML="";layout(games.length);shownCount=games.length;games.forEach((g,i)=>gr.appendChild(card(g,i)));filter()}
function filter(){
  const q=$("#q").value.trim().toLowerCase();let shown=0;
  document.querySelectorAll(".game").forEach(el=>{
    const ok=el.dataset.name.includes(q);
    if(ok){shown++;if(el.style.display==="none"){el.style.display="";void el.offsetWidth}el.classList.remove("hide")}
    else{el.classList.add("hide");setTimeout(()=>{if(el.classList.contains("hide"))el.style.display="none"},300)}
  });
  if(shown){shownCount=shown;layout(shown)}
  $("#empty").style.display=shown?"none":"block";
}
$("#q").oninput=filter;render();

/* ===== lista de jogos: vem do arquivo jogos.json do repositório (a lista do <seed> acima é só reserva) ===== */
fetch("jogos.json?v="+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(l=>{if(Array.isArray(l)){games=l;render()}}).catch(()=>{});

/* ===== admin: só quem é dono/editor da página vê e consegue salvar ===== */
$("#fTheme").innerHTML=Object.entries(TEMAS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
let editing=null;
function openForm(g){
  editing=g||null;$("#dtitle").textContent=g?"EDITAR JOGO":"NOVO JOGO";
  $("#fName").value=g?.name||"";$("#fUrl").value=g?.url||"";$("#fDesc").value=g?.desc||"";$("#fOwner").value=g?.owner||"";
  $("#fTheme").value=g?.theme||"arcade";$("#fEmoji").value=g?.emoji||"";$("#fCover").value="";$("#msg").textContent="";
  $("#dlg").showModal();
}
$("#add").onclick=()=>openForm(null);
$("#cancel").onclick=()=>$("#dlg").close();
/* capa em alta qualidade: recorta em 8:5 e guarda até 960x600 (antes era 320x200, borrava em telas grandes/retina).
   Imagens pequenas (pixel art) não são ampliadas: ficam no tamanho original e o navegador amplia sem borrar. */
function toCover(file){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const sw=Math.min(img.naturalWidth,img.naturalHeight*1.6),sh=sw/1.6,sx=(img.naturalWidth-sw)/2,sy=(img.naturalHeight-sh)/2;
      const pix=sw<=480,ow=Math.round(Math.min(960,sw)),oh=Math.round(ow/1.6);
      const c=document.createElement("canvas");c.width=ow;c.height=oh;const x=c.getContext("2d");
      x.imageSmoothingEnabled=!pix;x.imageSmoothingQuality="high";
      x.drawImage(img,sx,sy,sw,sh,0,0,ow,oh);URL.revokeObjectURL(u);
      res({url:c.toDataURL("image/webp",.92),pix});
    };img.onerror=()=>rej(new Error("não consegui ler essa imagem"));img.src=u;
  });
}
$("#ok").onclick=async()=>{
  const name=$("#fName").value.trim();let url=$("#fUrl").value.trim();
  if(!name||!url){$("#msg").textContent="Preencha nome e link.";return}
  if(!/^https?:\/\//i.test(url))url="https://"+url;
  try{
    $("#msg").textContent="Salvando...";
    let cover=editing?.cover,coverPix=editing?.coverPix;const f=$("#fCover").files[0];if(f){const c=await toCover(f);cover=c.url;coverPix=c.pix}
    const g={...(editing||{id:Date.now().toString(36)}),name,url,desc:$("#fDesc").value.trim(),owner:$("#fOwner").value.trim(),theme:$("#fTheme").value,emoji:$("#fEmoji").value.trim(),cover,coverPix};
    await save(editing?games.map(x=>x.id===g.id?g:x):[g,...games]);
    $("#dlg").close();
  }catch(e){$("#msg").textContent="Não foi possível salvar: "+(e&&e.message||e)}
};
/* ===== SALVAR NO GITHUB =====
   Quem manda é o próprio GitHub: só um token com permissão de escrita no seu repositório consegue gravar.
   O token NÃO fica no código; fica só no navegador de quem digitou (localStorage). */
const FILE="jogos.json";
/* token do GitHub guardado CRIPTOGRAFADO (AES-256-GCM, chave derivada da senha com PBKDF2). Sem a senha certa ele não abre. */
const VAULT="9iXiBIJNEpl4gx4SgC8pU06MhV5+xWP39SciL16A56CgXpA8I6csxr9D1PWK0D+mYKwOUvu/7wMG/DCwiw+LbV2drYAAth0sZc3XSN6iepGRk1KOZwmgz067c0xuHkjKYn0EhS+sO1CXp6djvNekCJzPZ2sQYPtPZdO5We1aU0BTgofpa3LkQj4=";
const b64=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function openVault(pass){
  const d=b64(VAULT),km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d.slice(0,16),iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(16,28)},key,d.slice(28)); // erro = senha errada
  return new TextDecoder().decode(pt);
}
/* descobre sozinho em qual repositório o token pode escrever (o que tem o jogos.json tem prioridade) */
async function findRepo(tk){
  const H={Accept:"application/vnd.github+json",Authorization:"Bearer "+tk};
  const res=await fetch("https://api.github.com/user/repos?per_page=100&sort=pushed",{headers:H});
  if(!res.ok)return null;
  const list=(await res.json()).filter(r=>r.permissions&&r.permissions.push);
  for(const r of list.slice(0,12)){
    try{const x=await fetch(`https://api.github.com/repos/${r.full_name}/contents/${FILE}`,{headers:H});if(x.ok)return{owner:r.owner.login,repo:r.name,branch:""}}catch(e){}
  }
  return list.length===1?{owner:list[0].owner.login,repo:list[0].name,branch:""}:null;
}
function repoInfo(){
  let r=null;try{r=JSON.parse(localStorage.getItem("hub_repo"))}catch(e){}
  if(r&&r.owner&&r.repo)return r;
  // detecta sozinho em https://USUARIO.github.io/REPO/
  const o=location.hostname.endsWith(".github.io")?location.hostname.split(".")[0]:"";
  const p=location.pathname.split("/").filter(Boolean)[0]||"";
  return {owner:o,repo:(p&&!p.includes("."))?p:(o?o+".github.io":""),branch:""};
}
const u8=s=>btoa(unescape(encodeURIComponent(s)));
const fromU8=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,""))));
async function gh(path,opt={}){
  const r=repoInfo(),tk=localStorage.getItem("hub_token");
  const res=await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}${path}`,{...opt,headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+tk,...(opt.headers||{})}});
  if(!res.ok){let m="";try{m=(await res.json()).message}catch(e){}throw new Error("GitHub "+res.status+(m?": "+m:""))}
  return res.json();
}
async function remoteFile(){
  try{return await gh("/contents/"+FILE)}catch(e){if(String(e.message).includes(" 404"))return null;throw e}
}
async function save(list){
  if(!admin)throw new Error("entre como dono (Shift+Alt+V)");
  const cur=await remoteFile();
  const body={message:"286HUB: atualiza jogos",content:u8(JSON.stringify(list,null,1))};
  if(cur)body.sha=cur.sha;
  const r=repoInfo();if(r.branch)body.branch=r.branch;
  await gh("/contents/"+FILE,{method:"PUT",body:JSON.stringify(body)});
  games=list;render();
  alert("Salvo! O site público pode levar ~1 minuto para mostrar a mudança.");
}
async function enterAdmin(){
  const rm=await remoteFile();               // lê a versão mais nova direto do GitHub
  if(rm){
    try{
      // arquivo com mais de 1 MB (muitas capas): o GitHub não manda o conteúdo junto, então busca o arquivo inteiro
      const l=rm.content?JSON.parse(fromU8(rm.content)):await gh("/contents/"+FILE,{headers:{Accept:"application/vnd.github.raw+json"}});
      if(Array.isArray(l))games=l;
    }catch(e){}
  }
  admin=true;$("#add").style.display="block";$("#out").style.display="block";render();
}
let pendingTk=null,fails=0;
function openPw(){
  pendingTk=null;$("#pwin").value="";$("#pwrepo").hidden=true;$("#pwin").hidden=false;$("#pwmsg").textContent="";
  $("#pw").hidden=false;setTimeout(()=>$("#pwin").focus(),30);
}
function closePw(){$("#pw").hidden=true;pendingTk=null}
function pwErr(m){
  $("#pwmsg").textContent=m;const b=$("#pwform");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");
}
async function login(){
  const ok=$("#pwok");ok.disabled=true;$("#pwmsg").textContent="VERIFICANDO...";
  try{
    let tk=pendingTk,r=null;
    if(!tk){
      try{tk=await openVault($("#pwin").value)}
      catch(e){
        fails++;await new Promise(x=>setTimeout(x,Math.min(fails,5)*600));
        pwErr("SENHA INCORRETA");$("#pwin").select();return;
      }
      fails=0;
    }
    if(pendingTk){
      const t=$("#pwrepo").value.trim().split("/");
      if(t.length!==2||!t[0]||!t[1]){pwErr("USE O FORMATO usuario/repositorio");return}
      r={owner:t[0],repo:t[1],branch:""};
    }else{
      r=repoInfo();if(!r.owner||!r.repo||!localStorage.getItem("hub_repo"))r=await findRepo(tk);
    }
    if(!r){
      pendingTk=tk;$("#pwin").hidden=true;$("#pwrepo").hidden=false;$("#pwrepo").focus();
      pwErr("SENHA OK! NÃO ACHEI O REPOSITÓRIO SOZINHO: INFORME ABAIXO");return;
    }
    localStorage.setItem("hub_token",tk);localStorage.setItem("hub_repo",JSON.stringify(r));
    const info=await gh("");
    if(!info.permissions||!info.permissions.push)throw new Error("o token não tem permissão de escrita nesse repositório");
    closePw();await enterAdmin();
  }catch(e){
    localStorage.removeItem("hub_token");
    if(pendingTk)pwErr("ERRO: "+(e.message||e));else{pendingTk=null;pwErr("ERRO: "+(e.message||e))}
  }finally{ok.disabled=false}
}
function logout(){localStorage.removeItem("hub_token");admin=false;location.reload()}
const toggleAdmin=()=>admin?logout():($("#pw").hidden?openPw():closePw());
$("#out").onclick=logout;
$("#pwform").addEventListener("submit",e=>{e.preventDefault();login()});
$("#pwx").onclick=closePw;
$("#pw").addEventListener("pointerdown",e=>{if(e.target.id==="pw")closePw()});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#pw").hidden)closePw()});
/* atalho secreto: Shift + Alt + V (usa a tecla física V, então funciona em qualquer layout/Mac) */
addEventListener("keydown",e=>{
  if(e.shiftKey&&e.altKey&&!e.ctrlKey&&!e.metaKey&&e.code==="KeyV"){e.preventDefault();toggleAdmin()}
});
/* alternativa para celular (sem teclado): toque 5 vezes rápido em "286HUB" no rodapé */
let taps=[];
$("#sec").addEventListener("click",()=>{
  const t=Date.now();taps=taps.filter(x=>t-x<2000);taps.push(t);
  if(taps.length>=5){taps=[];toggleAdmin()}
});
if(localStorage.getItem("hub_token")){enterAdmin().catch(()=>{localStorage.removeItem("hub_token")})}
</script>
